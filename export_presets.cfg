[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="docs/*"
export_path="docs/index.html"

[preset.0.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><style>#rotate{display:none}@media (orientation:portrait){#rotate{display:flex;position:fixed;inset:0;z-index:99;background:#000;color:#ddd;font:20px sans-serif;align-items:center;justify-content:center;text-align:center}}</style><script>addEventListener('DOMContentLoaded',()=>{const d=document.createElement('div');d.id='rotate';d.textContent='Turn your phone sideways to play';document.body.appendChild(d)});addEventListener('pointerdown',()=>{try{screen.orientation.lock('landscape')}catch(e){}},{once:true})</script>"
